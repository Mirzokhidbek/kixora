<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>KIXORA — Step Into More | Premium Footwear & Apparel</title>
    
    <!-- SEO & Social Meta Tags -->
    <meta name="description" content="KIXORA — Step Into More. Discover premium luxury sneakers, athletic running shoes, and exclusive designer footwear." />
    <meta name="keywords" content="luxury footwear, sneakers, designer shoes, running shoes, athletic footwear, street luxury, KIXORA" />
    <meta name="author" content="KIXORA Luxury Footwear" />
    <meta name="theme-color" content="#000000" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KIXORA — Step Into More | Premium Footwear" />
    <meta property="og:description" content="Discover premium luxury sneakers, athletic performance footwear, and designer collections." />
    <meta property="og:image" content="/img/kixora/logo.png" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KIXORA — Step Into More" />
    <meta name="twitter:description" content="Discover premium luxury sneakers, athletic performance footwear, and designer collections." />
    <meta name="twitter:image" content="/img/kixora/logo.png" />
    
    <link rel="canonical" href="https://kixora.vercel.app/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Schema.org JSON-LD Structured Data for Rich Results & AI Browsing -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ClothingStore",
      "name": "KIXORA",
      "image": "https://kixora.vercel.app/img/kixora/logo.png",
      "description": "Premium luxury sneakers, athletic running shoes, and exclusive designer footwear.",
      "url": "https://kixora.vercel.app/",
      "priceRange": "$$$",
      "currenciesAccepted": "USD",
      "paymentAccepted": "Credit Card, Debit Card",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://kixora.vercel.app/products?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Google Fonts Preconnect & Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
